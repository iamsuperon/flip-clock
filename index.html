<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; overflow: hidden; }

:root {
  --cw:  12vw;
  --ch:  19.3vw;
  --hh:  9.65vw;
  --fs:  15.4vw;
  --gap: 0.7vw;
  --sep: 2.2vw;
  --br:  0.6vw;
  --div: 0.22vw;
}

body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Bebas Neue', 'Impact', sans-serif;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 70% at 50% 50%, #1a1a1a 0%, #000 100%);
  pointer-events: none;
  z-index: 0;
}

/* ── Main wrapper ── */
.clock-wrapper {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3vh;
  user-select: none;
}

.clock {
  display: flex;
  align-items: center;
  gap: var(--sep);
}
.segment { display: flex; gap: var(--gap); }

/* ── Flip card ── */
.card {
  position: relative;
  width: var(--cw); height: var(--ch);
  border-radius: var(--br);
  perspective: calc(var(--cw) * 4);
  flex-shrink: 0;
}
.card::before {
  content: '';
  position: absolute;
  bottom: calc(var(--cw) * -0.12);
  left: 10%; right: 10%;
  height: calc(var(--cw) * 0.12);
  background: rgba(0,0,0,0.8);
  filter: blur(calc(var(--cw) * 0.08));
  border-radius: 50%;
  z-index: 0;
}
.divider {
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: var(--div);
  background: #000;
  transform: translateY(-50%);
  z-index: 30;
  pointer-events: none;
}
.panel {
  position: absolute;
  left: 0; right: 0;
  width: 100%; height: 50%;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.static-top {
  top: 0;
  border-radius: var(--br) var(--br) 0 0;
  background: linear-gradient(180deg, #272727 0%, #1d1d1d 100%);
  z-index: 2;
  border-bottom: calc(var(--div) * 0.5) solid #000;
}
.static-bot {
  bottom: 0;
  border-radius: 0 0 var(--br) var(--br);
  background: linear-gradient(180deg, #1a1a1a 0%, #131313 100%);
  z-index: 2;
  border-top: calc(var(--div) * 0.5) solid #000;
}
.flip-top {
  top: 0;
  border-radius: var(--br) var(--br) 0 0;
  background: linear-gradient(180deg, #272727 0%, #1d1d1d 100%);
  transform-origin: center bottom;
  z-index: 10;
  border-bottom: calc(var(--div) * 0.5) solid #000;
}
.flip-bot {
  bottom: 0;
  border-radius: 0 0 var(--br) var(--br);
  background: linear-gradient(180deg, #1a1a1a 0%, #131313 100%);
  transform-origin: center top;
  transform: rotateX(90deg);
  z-index: 8;
  border-top: calc(var(--div) * 0.5) solid #000;
}
.digit {
  position: absolute;
  left: 0; right: 0; width: 100%;
  height: var(--ch);
  text-align: center;
  line-height: var(--ch);
  font-size: var(--fs);
  color: #fff;
  letter-spacing: -0.02em;
  pointer-events: none;
}
.static-top .digit, .flip-top .digit { top: 0; }
.static-bot .digit, .flip-bot .digit { top: calc(-1 * var(--hh)); }
.static-top::after, .flip-top::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, transparent 60%);
  pointer-events: none;
}
.static-bot::after, .flip-bot::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(0,0,0,0.25) 0%, transparent 60%);
  pointer-events: none;
}
.card-border {
  position: absolute; inset: 0;
  border-radius: var(--br);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 1.5vw 4vw rgba(0,0,0,0.95),
    0 0.4vw 1vw rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.09);
  z-index: 40;
  pointer-events: none;
}

@keyframes flipTopOut {
  0%   { transform: rotateX(0deg); }
  100% { transform: rotateX(-90deg); }
}
@keyframes flipBotIn {
  0%   { transform: rotateX(90deg); }
  100% { transform: rotateX(0deg); }
}
.flip-top.animating { animation: flipTopOut 0.27s cubic-bezier(0.55,0,0.9,0.5) forwards; }
.flip-bot.animating { animation: flipBotIn  0.27s cubic-bezier(0.1,0.5,0.45,1) 0.23s forwards; }

/* ── Separators ── */
.separator {
  display: flex;
  flex-direction: column;
  gap: calc(var(--ch) * 0.18);
  align-items: center;
}
.dot {
  width: calc(var(--cw) * 0.11);
  height: calc(var(--cw) * 0.11);
  border-radius: 50%;
  background: #444;
  box-shadow: 0 0 0.5vw rgba(200,200,200,0.08);
  animation: blink 1s ease-in-out infinite alternate;
}
.dot:nth-child(2) { animation-delay: 0.15s; }
@keyframes blink {
  0%   { opacity: 0.35; }
  100% { opacity: 0.8; }
}

/* ── Info block (date + weather) ── */
.info-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2vh;
}
.date-row {
  display: flex;
  align-items: center;
  gap: 1.6vw;
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.2vw;
  letter-spacing: 0.5vw;
  -webkit-text-stroke: 0.04vw #fff;
}
.date-sep {
  display: inline-block;
  width: 0.5vw; height: 0.5vw;
  border-radius: 50%;
  background: #505050;
  flex-shrink: 0;
}
.weather-row {
  display: flex;
  align-items: center;
  gap: 1vw;
  color: #d8d8d8;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8vw;
  letter-spacing: 0.25vw;
  min-height: 2.5vw;
  cursor: pointer;
}
.weather-row:hover { color: #fff; }
.weather-temp { color: #888; }
.weather-icon { font-style: normal; font-size: 2vw; line-height: 1; }
.weather-dot {
  display: inline-block;
  width: 0.35vw; height: 0.35vw;
  border-radius: 50%;
  background: #363636;
}
/* location label inside weather row */
.weather-loc {
  color: #555;
  font-size: 1.5vw;
  letter-spacing: 0.25vw;
}

/* ── Bottom-right: secondary clock ── */
.bottom-right {
  position: fixed;
  bottom: 2.5vh; right: 2.5vw;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  gap: 1.4vw;
}
.sec-widget {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.4vh;
  overflow: hidden;
  max-width: 24vw;
  transition: max-width 0.35s cubic-bezier(0.4,0,0.2,1),
              opacity   0.3s ease;
  opacity: 1;
}
.sec-widget.hidden {
  max-width: 0;
  opacity: 0;
  pointer-events: none;
}
.sec-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1vw;
  letter-spacing: 0.35vw;
  color: #757575;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4vw;
}
.sec-label:hover { color: #bbb; }
.sec-label svg {
  width: 0.9vw; height: 0.9vw;
  flex-shrink: 0;
  opacity: 0.5;
}
.sec-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3.4vw;
  color: #d8d8d8;
  letter-spacing: 0.1vw;
  line-height: 1;
  white-space: nowrap;
}
.sec-ampm {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1vw;
  letter-spacing: 0.3vw;
  color: #484848;
  text-align: right;
  white-space: nowrap;
}

/* Eye toggle button */
.eye-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  color: #3e3e3e;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1vw;
  letter-spacing: 0.25vw;
  padding: 0.7vh 1.1vw;
  border-radius: 0.4vw;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  white-space: nowrap;
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 0.5vw;
}
.eye-btn:hover {
  background: rgba(255,255,255,0.09);
  color: #aaa;
  border-color: rgba(255,255,255,0.2);
}
.eye-btn svg {
  width: 1.2vw; height: 1.2vw;
  flex-shrink: 0;
}

/* ── City search modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: #111;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 1vw;
  padding: 2.5vh 2.5vw;
  width: 36vw;
  min-width: 320px;
  box-shadow: 0 4vw 8vw rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
  gap: 1.5vh;
}
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5vw;
  letter-spacing: 0.4vw;
  color: #666;
}
.modal-input-wrap {
  display: flex;
  gap: 0.8vw;
}
.modal-input {
  flex: 1;
  background: #1c1c1c;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 0.5vw;
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4vw;
  letter-spacing: 0.2vw;
  padding: 1vh 1vw;
  outline: none;
  transition: border-color 0.2s;
}
.modal-input:focus { border-color: rgba(255,255,255,0.35); }
.modal-search-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 0.5vw;
  color: #999;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2vw;
  letter-spacing: 0.2vw;
  padding: 0 1.2vw;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
}
.modal-search-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
.modal-results {
  display: flex;
  flex-direction: column;
  gap: 0.5vh;
  max-height: 28vh;
  overflow-y: auto;
}
.modal-result-item {
  background: #181818;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 0.4vw;
  padding: 1vh 1vw;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  display: flex;
  flex-direction: column;
  gap: 0.2vh;
}
.modal-result-item:hover { background: #222; border-color: rgba(255,255,255,0.18); }
.result-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3vw;
  letter-spacing: 0.2vw;
  color: #e0e0e0;
}
.result-sub {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.9vw;
  letter-spacing: 0.15vw;
  color: #555;
}
.modal-status {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1vw;
  letter-spacing: 0.2vw;
  color: #444;
  text-align: center;
  padding: 1vh 0;
}
.modal-cancel {
  background: none;
  border: none;
  color: #3a3a3a;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1vw;
  letter-spacing: 0.25vw;
  cursor: pointer;
  text-align: center;
  transition: color 0.2s;
  padding: 0.5vh 0;
}
.modal-cancel:hover { color: #888; }
</style>
</head>
<body>

<div class="clock-wrapper">
  <div class="clock">
    <div class="segment" id="hours"></div>
    <div class="separator"><div class="dot"></div><div class="dot"></div></div>
    <div class="segment" id="minutes"></div>
    <div class="separator"><div class="dot"></div><div class="dot"></div></div>
    <div class="segment" id="seconds"></div>
  </div>
  <div class="info-block">
    <div class="date-row" id="date-row"></div>
    <div class="weather-row" id="weather-row" title="Click to change location">FETCHING WEATHER&hellip;</div>
  </div>
</div>

<!-- Secondary clock (bottom-right) -->
<div class="bottom-right">
  <div class="sec-widget" id="sec-widget">
    <div class="sec-label" id="sec-label" title="Click to change city">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span id="sec-city-name">WOLLONGONG · AU</span>
    </div>
    <div class="sec-time" id="sec-time">--:--:--</div>
    <div class="sec-ampm" id="sec-ampm">--</div>
  </div>
  <button class="eye-btn" id="eye-btn" title="Show/hide secondary clock">
    <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    2ND
  </button>
</div>

<!-- City search modal (shared for both main + secondary) -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">SEARCH CITY</div>
    <div class="modal-input-wrap">
      <input class="modal-input" id="modal-input" type="text" placeholder="TYPE A CITY NAME..." autocomplete="off" spellcheck="false">
      <button class="modal-search-btn" id="modal-search-btn">GO</button>
    </div>
    <div class="modal-results" id="modal-results"></div>
    <div class="modal-status" id="modal-status"></div>
    <button class="modal-cancel" id="modal-cancel">CANCEL</button>
  </div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════
   FlipCard
══════════════════════════════════════ */
class FlipCard {
  constructor(parent) {
    this.el = document.createElement('div');
    this.el.className = 'card';
    parent.appendChild(this.el);
    this.stTop  = this._el('div','panel static-top');
    this.stTopD = this._digit(this.stTop);
    this.stBot  = this._el('div','panel static-bot');
    this.stBotD = this._digit(this.stBot);
    this.fTop   = this._el('div','panel flip-top');
    this.fTopD  = this._digit(this.fTop);
    this.fBot   = this._el('div','panel flip-bot');
    this.fBotD  = this._digit(this.fBot);
    this._el('div','divider');
    this._el('div','card-border');
    this.current = null;
    this.busy    = false;
  }
  _el(tag,cls){ const e=document.createElement(tag); e.className=cls; this.el.appendChild(e); return e; }
  _digit(p){ const e=document.createElement('div'); e.className='digit'; p.appendChild(e); return e; }
  init(val){
    val=String(val); this.current=val;
    [this.stTopD,this.stBotD,this.fTopD,this.fBotD].forEach(d=>d.textContent=val);
    this.fTop.style.transform=''; this.fBot.style.transform='rotateX(90deg)';
  }
  flip(next){
    next=String(next);
    if(next===this.current||this.busy) return;
    this.busy=true; const prev=this.current; this.current=next;
    this.stTopD.textContent=next; this.stBotD.textContent=prev;
    this.fTopD.textContent=prev;  this.fBotD.textContent=next;
    this.fTop.classList.remove('animating'); this.fBot.classList.remove('animating');
    this.fTop.style.transform='rotateX(0deg)'; this.fBot.style.transform='rotateX(90deg)';
    void this.fTop.offsetWidth;
    this.fTop.classList.add('animating'); this.fBot.classList.add('animating');
    setTimeout(()=>{
      this.stBotD.textContent=next;
      this.fTop.classList.remove('animating'); this.fBot.classList.remove('animating');
      this.fTop.style.transform='rotateX(0deg)'; this.fBot.style.transform='rotateX(90deg)';
      this.fTopD.textContent=next; this.fBotD.textContent=next;
      this.busy=false;
    },660);
  }
}

/* ══════════════════════════════════════
   State
══════════════════════════════════════ */
const DAYS   = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

// Main clock: user's local time + weather at their location
let mainTimezone = null;   // null = use browser local time
let mainWeatherLat = null;
let mainWeatherLon = null;

// Secondary clock: any city the user picks
let secTimezone  = 'Australia/Sydney';
let secCityLabel = 'WOLLONGONG · AU';

let prevH='',prevM='',prevS='';
let secVisible = true;

function makeCards(id,n){
  const seg=document.getElementById(id);
  return Array.from({length:n},()=>new FlipCard(seg));
}
const hCards=makeCards('hours',2);
const mCards=makeCards('minutes',2);
const sCards=makeCards('seconds',2);

/* ══════════════════════════════════════
   Main flip clock — always local time
   (mainTimezone drives it once set)
══════════════════════════════════════ */
function getMainNow(){
  // We always use the browser's wall clock; timezone only matters for
  // weather display label. The flip cards show device local time.
  return new Date();
}

function updateClock(){
  const now = getMainNow();
  const raw = now.getHours() % 12 || 12;
  const h=String(raw).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');

  if(!prevH){
    hCards[0].init(h[0]); hCards[1].init(h[1]);
    mCards[0].init(m[0]); mCards[1].init(m[1]);
    sCards[0].init(s[0]); sCards[1].init(s[1]);
  } else {
    if(h[0]!==prevH[0]) hCards[0].flip(h[0]);
    if(h[1]!==prevH[1]) hCards[1].flip(h[1]);
    if(m[0]!==prevM[0]) mCards[0].flip(m[0]);
    if(m[1]!==prevM[1]) mCards[1].flip(m[1]);
    if(s[0]!==prevS[0]) sCards[0].flip(s[0]);
    if(s[1]!==prevS[1]) sCards[1].flip(s[1]);
  }
  prevH=h; prevM=m; prevS=s;

  document.getElementById('date-row').innerHTML =
    DAYS[now.getDay()] +
    '<span class="date-sep"></span>' +
    MONTHS[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
}

/* ══════════════════════════════════════
   Secondary clock
══════════════════════════════════════ */
function updateSecClock(){
  const now = new Date();
  try {
    const raw = now.toLocaleTimeString('en-US', {
      timeZone: secTimezone,
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: true
    });
    const parts = raw.trim().split(' ');
    document.getElementById('sec-time').textContent = parts[0]||'--:--:--';
    document.getElementById('sec-ampm').textContent = (parts[1]||'').toUpperCase();
  } catch(e){
    document.getElementById('sec-time').textContent = '--:--:--';
    document.getElementById('sec-ampm').textContent = '';
  }
}

/* ══════════════════════════════════════
   Eye toggle
══════════════════════════════════════ */
const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
const eyeOff  = `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

document.getElementById('eye-btn').addEventListener('click',()=>{
  secVisible=!secVisible;
  document.getElementById('sec-widget').classList.toggle('hidden',!secVisible);
  document.getElementById('eye-icon').innerHTML = secVisible ? eyeOpen : eyeOff;
});

/* ══════════════════════════════════════
   Tick
══════════════════════════════════════ */
updateClock(); updateSecClock();
const drift = 1000-(Date.now()%1000);
setTimeout(()=>{
  updateClock(); updateSecClock();
  setInterval(()=>{ updateClock(); updateSecClock(); },1000);
},drift);

/* ══════════════════════════════════════
   Weather — Open-Meteo (no API key)
══════════════════════════════════════ */
const WMO_ICON={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',77:'❄️',80:'🌦️',81:'🌦️',82:'🌧️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WMO_DESC={0:'CLEAR SKY',1:'MAINLY CLEAR',2:'PARTLY CLOUDY',3:'OVERCAST',45:'FOGGY',48:'FREEZING FOG',51:'LIGHT DRIZZLE',53:'DRIZZLE',55:'HEAVY DRIZZLE',61:'LIGHT RAIN',63:'RAIN',65:'HEAVY RAIN',71:'LIGHT SNOW',73:'SNOW',75:'HEAVY SNOW',77:'SNOW GRAINS',80:'LIGHT SHOWERS',81:'SHOWERS',82:'HEAVY SHOWERS',85:'SNOW SHOWERS',86:'HEAVY SNOW SHOWERS',95:'THUNDERSTORM',96:'THUNDERSTORM + HAIL',99:'HEAVY THUNDERSTORM'};

let weatherLabel = '';

async function fetchWeather(lat,lon,label){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code&temperature_unit=celsius`;
  const res=await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data=await res.json();
  const c=data.current;
  const temp=Math.round(c.temperature_2m);
  const feels=Math.round(c.apparent_temperature);
  const icon=WMO_ICON[c.weather_code]??'';
  const desc=WMO_DESC[c.weather_code]??'UNKNOWN';
  weatherLabel = label || '';
  document.getElementById('weather-row').innerHTML =
    (icon?`<span class="weather-icon">${icon}</span>`:'') +
    `<span class="weather-temp">${temp}&deg;C</span>` +
    `<span class="weather-dot"></span>` +
    `<span>FEELS ${feels}&deg;C</span>` +
    `<span class="weather-dot"></span>` +
    `<span>${desc}</span>` +
    (weatherLabel ? `<span class="weather-dot"></span><span class="weather-loc">${weatherLabel}</span>` : '');
}

function loadWeather(){
  if(mainWeatherLat!==null){
    fetchWeather(mainWeatherLat,mainWeatherLon,weatherLabel).catch(()=>{
      document.getElementById('weather-row').textContent='WEATHER UNAVAILABLE';
    });
    return;
  }
  // Try geolocation first
  if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(
      p=>{
        mainWeatherLat=p.coords.latitude;
        mainWeatherLon=p.coords.longitude;
        fetchWeather(mainWeatherLat,mainWeatherLon,'').catch(()=>{
          document.getElementById('weather-row').textContent='WEATHER UNAVAILABLE';
        });
      },
      ()=>{
        // Permission denied — show prompt to pick location
        document.getElementById('weather-row').innerHTML =
          '<span style="color:#444;cursor:pointer" id="set-loc-link">📍 CLICK TO SET YOUR LOCATION</span>';
        document.getElementById('set-loc-link').addEventListener('click',()=>openModal('main'));
      },
      {timeout:6000}
    );
  } else {
    document.getElementById('weather-row').innerHTML =
      '<span style="color:#444;cursor:pointer" id="set-loc-link">📍 CLICK TO SET YOUR LOCATION</span>';
    document.getElementById('set-loc-link').addEventListener('click',()=>openModal('main'));
  }
}

loadWeather();
setInterval(()=>{
  if(mainWeatherLat!==null) loadWeather();
},10*60*1000);

// Click weather row to re-pick location
document.getElementById('weather-row').addEventListener('click',()=>openModal('main'));

/* ══════════════════════════════════════
   City search modal
   mode: 'main' (weather/location) or 'sec' (secondary clock)
══════════════════════════════════════ */
let modalMode = 'sec';

function openModal(mode){
  modalMode = mode;
  document.getElementById('modal-title').textContent =
    mode==='main' ? 'SET YOUR LOCATION' : 'SET SECOND CLOCK CITY';
  document.getElementById('modal-input').value='';
  document.getElementById('modal-results').innerHTML='';
  document.getElementById('modal-status').textContent='';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('modal-input').focus(),80);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('sec-label').addEventListener('click',()=>openModal('sec'));
document.getElementById('modal-cancel').addEventListener('click',closeModal);
document.getElementById('modal-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal-overlay')) closeModal();
});

/* Search using Open-Meteo geocoding (free, no key) */
async function searchCity(query){
  const status=document.getElementById('modal-status');
  const results=document.getElementById('modal-results');
  status.textContent='SEARCHING…';
  results.innerHTML='';
  try{
    const res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=8&language=en&format=json`);
    const data=await res.json();
    status.textContent='';
    if(!data.results||!data.results.length){
      status.textContent='NO RESULTS FOUND';
      return;
    }
    data.results.forEach(place=>{
      const item=document.createElement('div');
      item.className='modal-result-item';
      const country=place.country||'';
      const admin=place.admin1||'';
      const sub=[admin,country].filter(Boolean).join(', ');
      item.innerHTML=`<div class="result-name">${place.name}</div><div class="result-sub">${sub}</div>`;
      item.addEventListener('click',()=>selectPlace(place));
      results.appendChild(item);
    });
  } catch(e){
    status.textContent='SEARCH FAILED — CHECK CONNECTION';
  }
}

function selectPlace(place){
  const label=[place.name, place.country_code||''].filter(Boolean).join(' · ').toUpperCase();
  const tz=place.timezone||'UTC';

  if(modalMode==='main'){
    mainWeatherLat=place.latitude;
    mainWeatherLon=place.longitude;
    weatherLabel=label;
    fetchWeather(mainWeatherLat,mainWeatherLon,weatherLabel).catch(()=>{
      document.getElementById('weather-row').textContent='WEATHER UNAVAILABLE';
    });
  } else {
    secTimezone=tz;
    secCityLabel=label;
    document.getElementById('sec-city-name').textContent=label;
    updateSecClock();
  }
  closeModal();
}

/* Search on Enter or button click */
function doSearch(){
  const q=document.getElementById('modal-input').value.trim();
  if(q.length<2) return;
  searchCity(q);
}
document.getElementById('modal-search-btn').addEventListener('click',doSearch);
document.getElementById('modal-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') doSearch();
  if(e.key==='Escape') closeModal();
});
</script>
